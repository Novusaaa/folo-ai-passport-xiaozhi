<!DOCTYPE html>
<html>
<head>
    <title>novus · 配网完成</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <style>
        /* ===== novus 配网完成页 ===== */
        :root {
            color-scheme: light;
            --bg: #f6f4ed;
            --surface: #fffdf8;
            --line: #e7e3d8;
            --ink: #1f3b5c;
            --ink-soft: #5b6b80;
            --muted: #6d7887;
            --sakura: #e6b3c0;
            --grape: #6b4c7a;
            --ok: #416852;
            --shadow: 0 8px 28px rgba(31, 59, 92, 0.04);
        }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            overflow-wrap: anywhere;
        }
        .container {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            max-width: 460px; margin: 0 auto;
            min-height: 100vh; min-height: 100svh; padding: 24px 16px calc(28px + env(safe-area-inset-bottom, 0px));
        }
        .card {
            position: relative;
            display: flex; flex-direction: column; align-items: center;
            background: var(--surface);
            border: 0;
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 40px 24px;
            width: 100%;
            max-width: 100%;
            overflow: hidden;
            text-align: center;
        }
        .brand { align-self: stretch; font-size: 31px; font-weight: 800; letter-spacing: -1.6px; line-height: 1; margin: 0 4px 24px; }
        .brand span { display: block; font-size: 11px; font-weight: 500; letter-spacing: 1.8px; color: var(--muted); margin-top: 8px; }
        .checkmark { width: 64px; height: 64px; margin: 4px 0 16px; display: block; }
        .checkmark__circle { fill: none; stroke: var(--ok); stroke-width: 2; }
        .checkmark__check { fill: none; stroke: var(--ok); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
        .message { margin: 0; }
        .message .primary { margin: 0; color: var(--ink); font-size: 16.5px; font-weight: 600; }
        .icon { margin: 4px 0 14px; }
        .icon svg, .icon img { width: 56px; height: 56px; }
        .icon svg { stroke: var(--ok); }
        .checkmark { display: block; width: 64px; height: 64px; flex: none; margin: 0 0 24px; fill: none; }
        .checkmark__circle { fill: #f3e4e9; stroke: none; }
        .checkmark__check { stroke: var(--grape); }
        h2, .title { margin: 0 0 8px; font-size: 18px; font-weight: 650; color: var(--ink); }
        p, .desc, .message { margin: 0; color: var(--ink-soft); font-size: 14.5px; line-height: 1.6; }
        .message { max-width: 100%; }
        .primary { color: var(--ink); font-size: 22px; font-weight: 650; line-height: 1.45; }
        .spinner {
            width: 30px; height: 30px; margin: 12px 0 4px;
            border-radius: 50%;
            border: 3px solid var(--sakura);
            border-top-color: var(--ink);
            animation: nov-spin 0.9s linear infinite;
        }
        @keyframes nov-spin { to { transform: rotate(360deg); } }
        @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; } }
</style>
</head>
<body>
    <div class="container">
        <div class="brand">novus<span>Wi-Fi SETUP</span></div>
        <div class="card">
            <div class="brand">novus<span>配网完成</span></div>
            <svg class="checkmark" viewBox="0 0 52 52">
                <circle class="checkmark__circle" cx="26" cy="26" r="25" stroke-width="2"/>
                <path class="checkmark__check" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
            </svg>

            <div class="message">
                <p class="primary" id="message">Configuration successful!</p>
            </div>
        </div>
    </div>
    
    <script>
        window.addEventListener('load', function() {
            const params = new URLSearchParams(window.location.search);
            const message = params.get('message') || 'Configuration successful!';
            document.title = message;
            document.getElementById('message').textContent = message;

            // Send exit request after a short delay
            setTimeout(function() {
                fetch('/exit', {
                    method: 'POST'
                })
                .then(response => {
                    if (response.ok) {
                        console.log('Exit config mode request sent');
                    } else {
                        console.error('Failed to send exit request');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                });
            }, 1000);
        });
    </script>
</body>
</html>
